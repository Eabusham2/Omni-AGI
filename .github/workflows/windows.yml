name: Windows

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            node_arch: x64
            python_arch: x64
            worker_arch: x64
            package_script: package:win
          - arch: arm64
            runner: windows-11-arm
            node_arch: arm64
            # PyTorch and PyInstaller now publish Windows ARM64 builds, but the
            # complete release runtime still has binary-wheel gaps (including
            # pyarrow and imageio-ffmpeg). Keep the app shell native ARM64 and
            # label its complete x64 worker truthfully until every dependency
            # passes the native binary-only installation and package smoke.
            python_arch: x64
            worker_arch: x64
            package_script: package:win:arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-build.txt
            engine/locks/*.lock

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify stable release metadata
        run: npm run verify:release

      - name: Install hash-locked CPU brain runtime
        run: |
          python scripts/install-engine-lock.py
          python -m pip check
          python -c "import torch; assert torch.isfinite(torch.empty(1).fill_(1)).all(), f'invalid torch runtime {torch.__version__}'"

      - name: Check Python syntax
        run: python -m compileall -q engine

      - name: Test desktop app
        run: npm run test:node:ci

      - name: Build desktop app
        run: npm run build

      - name: Test built desktop UI contracts
        run: npm run test:ui:contract

      - name: Build self-contained brain worker
        env:
          OMNI_SKIP_BUILD_DEPENDENCY_INSTALL: "1"
        run: npm run build:engine:win

      - name: Smoke self-contained brain worker
        shell: pwsh
        run: |
          ./scripts/smoke-engine.ps1 `
            -Executable ./engine-dist/omni-engine/omni-engine.exe `
            -BrainRoot "${{ runner.temp }}/omni-worker-${{ matrix.arch }}" `
            -HealthOnly

      - name: Package unsigned signed-ready Windows installer and archive
        env:
          OMNI_SKIP_BUILD_DEPENDENCY_INSTALL: "1"
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Arch "${{ matrix.arch }}" -SkipBuild

      - name: Smoke ZIP, silent NSIS install, and installed worker
        env:
          OMNI_EXPECT_SIGNED: "0"
        shell: pwsh
        run: |
          ./scripts/smoke-windows-package.ps1 `
            -Arch "${{ matrix.arch }}" `
            -ExpectedWorkerArch "${{ matrix.worker_arch }}" `
            -ReleaseRoot ./release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omni-agi-studio-windows-${{ matrix.arch }}
          if-no-files-found: error
          # Installer and ZIP outputs are already compressed. Avoid spending
          # runner CPU recompressing bytes that do not shrink meaningfully.
          compression-level: 0
          path: |
            release/*-Windows-${{ matrix.arch }}.exe
            release/*-Windows-${{ matrix.arch }}.zip
            release/windows-package-smoke-${{ matrix.arch }}.json
