name: Independent video runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-latest, msystem: UCRT64, compiler: mingw-w64-ucrt-x86_64-gcc, pkgconfig: mingw-w64-ucrt-x86_64-pkgconf }
          - { target: win32-arm64, runner: windows-11-arm, msystem: CLANGARM64, compiler: mingw-w64-clang-aarch64-clang, pkgconfig: mingw-w64-clang-aarch64-pkgconf }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config xz-utils gnupg
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config xz gnupg
      - name: Windows native build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: make git curl tar xz gnupg ${{ matrix.compiler }} ${{ matrix.pkgconfig }}
      - name: Build and codec-only round-trip
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-video-runtime.sh '${{ matrix.target }}'
      - name: Build and codec-only round-trip on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-video-runtime.sh '${{ matrix.target }}'
      - name: Inspect native binary dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: ldd 'codec-output/${{ matrix.target }}/ffmpeg-${{ matrix.target }}' > 'codec-output/${{ matrix.target }}/binary-dependencies.txt'
      - name: Inspect native binary dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: otool -L 'codec-output/${{ matrix.target }}/ffmpeg-${{ matrix.target }}' > 'codec-output/${{ matrix.target }}/binary-dependencies.txt'
      - name: Inspect native binary dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          inspector=$(command -v llvm-objdump || command -v objdump)
          "$inspector" -p 'codec-output/${{ matrix.target }}/ffmpeg-${{ matrix.target }}.exe' | grep 'DLL Name' > 'codec-output/${{ matrix.target }}/binary-dependencies.txt'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: video-runtime-${{ matrix.target }}
          path: codec-output/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
